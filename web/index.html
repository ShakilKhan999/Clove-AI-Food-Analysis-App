  <title>Recipe</title>

  <script>
    // The value below is injected by flutter build, do not touch.
    const serviceWorkerVersion = null;

    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyAgsCX9Dk3-Ys05OZnIpnHy09jCWDATkjo",
      authDomain: "recipe-f3970.firebaseapp.com",
      projectId: "recipe-f3970",

      messagingSenderId: "322167248889",
      appId: "1:322167248889:web:cb5f411a2de20967334f28",
      measurementId: "G-KH1LM91HTQ"
    };

    // Initialize Firebase
    function initializeFirebase() {
      if (typeof firebase !== "undefined") {
        firebase.initializeApp(firebaseConfig);
        console.log("Firebase initialized successfully");

        // Optional: Initialize Analytics if available
        if (typeof firebase.analytics === "function") {
          firebase.analytics();
          console.log("Firebase Analytics initialized");
        }
      } else {
        console.warn("Firebase SDK not loaded");
      }
    }

    // Speech Recognition Setup
    function setupSpeechRecognition() {
      if (typeof SpeechRecognition === 'undefined') {
        if (typeof webkitSpeechRecognition !== 'undefined') {
          window.SpeechRecognition = webkitSpeechRecognition;
        } else {
          console.warn('Speech recognition not supported');
        }
      }

      if (typeof SpeechSynthesisUtterance === 'undefined') {
        if (typeof webkitSpeechSynthesisUtterance !== 'undefined') {
          window.SpeechSynthesisUtterance = webkitSpeechSynthesisUtterance;
        } else {
          console.warn('Speech synthesis not supported');
        }
      }
    }

    // Initialize Application on Page Load
    window.addEventListener('load', function() {
      setupSpeechRecognition();
      initializeFirebase();

      // Initialize speech recognition if available
      if (window.SpeechRecognition) {
        window.speechRecognition = new SpeechRecognition();
      }

      // Load Flutter Entrypoint
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        },
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine().then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
